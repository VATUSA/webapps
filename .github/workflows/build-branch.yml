name: Build Branch Image

# Build and push vatusa/portal and/or vatusa/staff (:<sha> and :branch-<name>) from any branch except
# the default one, for testing unmerged work. Never moves :latest, never deploys, and prod releases are
# gated separately.
#   gh workflow run build-branch.yml --ref my-branch [-f apps=portal] [-f platforms=linux/amd64]
# The branch must contain this file; merge the default branch into older branches first.
# Use ci-master.yml (automatic on push) for the default branch.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Which image(s) to build'
        type: choice
        options: [both, portal, staff]
        default: both
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'

# A newer dispatch on the same branch supersedes an older one.
concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-portal:
    if: github.ref_name != github.event.repository.default_branch && inputs.apps != 'staff'
    uses: vatusa/gitops/.github/workflows/common-build.yml@main
    with:
      image-name: 'portal'
      relative-path: 'apps/portal/'
      platforms: ${{ inputs.platforms }}
    secrets: inherit
  build-staff:
    if: github.ref_name != github.event.repository.default_branch && inputs.apps != 'portal'
    uses: vatusa/gitops/.github/workflows/common-build.yml@main
    with:
      image-name: 'staff'
      relative-path: 'apps/staff/'
      platforms: ${{ inputs.platforms }}
    secrets: inherit
