name: CI to Staging
on:
  push:
    branches: [master]
jobs:
  common-build-portal:
    uses: vatusa/gitops/.github/workflows/common-build.yml@main
    with:
      image-name: "portal"
      relative-path: "apps/portal/"
  common-dev-ci-portal:
    uses: vatusa/gitops/.github/workflows/common-dev-ci.yml@main
    with:
      image-name: "portal"
      kustomization-folder: "webapps"
    secrets: inherit
  common-build-staff:
    uses: vatusa/gitops/.github/workflows/common-build.yml@main
    with:
      image-name: "staff"
      relative-path: "apps/staff/"
    secrets: inherit
  common-dev-ci-staff:
    uses: vatusa/gitops/.github/workflows/common-dev-ci.yml@main
    needs: common-dev-ci-portal
    with:
      image-name: "staff"
      kustomization-folder: "webapps"
    secrets: inherit
