name: webapps-prod

services:
  cobalt_mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cobalt}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webapps

  cobalt:
    image: ${COBALT_IMAGE:-vatusa/cobalt:latest}
    restart: unless-stopped
    env_file:
      - ${COBALT_ENV_FILE:-cobalt.env}
    depends_on:
      cobalt_mysql:
        condition: service_healthy
    networks:
      - webapps

  staff:
    build:
      context: .
      dockerfile: apps/staff/Dockerfile
    restart: unless-stopped
    env_file:
      - ${STAFF_ENV_FILE:-apps/staff/.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_BASE_PATH: /staff
      COOKIE_SECRET: ${STAFF_COOKIE_SECRET:-${COOKIE_SECRET:-change-me}}
      COBALT_BASE_URL: http://cobalt:8080
    depends_on:
      - cobalt
    networks:
      - webapps

  vatusa:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    env_file:
      - ${VATUSA_ENV_FILE:-apps/portal/.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      COOKIE_SECRET: ${VATUSA_COOKIE_SECRET:-${COOKIE_SECRET:-change-me}}
      COBALT_BASE_URL: http://cobalt:8080
    depends_on:
      - cobalt
    networks:
      - webapps

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HOSTNAME: ${HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - staff
      - vatusa
      - cobalt
    networks:
      - webapps

networks:
  webapps:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

