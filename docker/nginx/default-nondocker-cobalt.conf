# /etc/nginx/conf.d/default.conf
server {
    server_name localhost;

    listen 8000;

    # Event banner uploads pass through here; the 1m default would reject
    # them. Matches the cluster ingress, which allows 128m.
    client_max_body_size 128m;

    location /cobalt/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
    }

    location /my {
        proxy_pass http://host.docker.internal:3002/my;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Required for WebSockets
        proxy_set_header Connection "upgrade"; # Required for WebSockets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /staff {
        proxy_pass http://host.docker.internal:3001/staff;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Required for WebSockets
        proxy_set_header Connection "upgrade"; # Required for WebSockets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /legacy {
        rewrite ^/legacy$ /legacy/ last;
    }

    location /legacy/ {
        rewrite ^/legacy/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Required for WebSockets
        proxy_set_header Connection "upgrade"; # Required for WebSockets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Required for WebSockets
        proxy_set_header Connection "upgrade"; # Required for WebSockets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}