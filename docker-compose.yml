services:
  cobalt_mysql:
    image: mysql:9
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cobalt
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - 13306:3306
    volumes:
      - mysql_data:/var/lib/mysql
  cobalt:
    image: vatusa/cobalt:latest
    # image: localhost/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    env_file:
      - cobalt.env
    depends_on:
      cobalt_mysql:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cobalt
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  mysql_data:
